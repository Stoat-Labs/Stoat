<!doctype html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="manifest" href="/site.webmanifest" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // Applies the theme cookie before first paint, and follows the OS while it is "system".
            // No cookie keeps the default dark theme. Keep in sync with $lib/theme.svelte.ts.
            (() => {
                const query = matchMedia("(prefers-color-scheme: dark)");
                const apply = () => {
                    const theme = document.cookie.match(/(?:^|; )theme=(\w+)/)?.[1] ?? "dark";
                    document.documentElement.classList.toggle(
                        "dark",
                        theme === "dark" || (theme === "system" && query.matches),
                    );
                };
                apply();
                query.addEventListener("change", apply);

                // Same for the accent color; no cookie keeps the default lime.
                const accent = document.cookie.match(/(?:^|; )accent=(\w+)/)?.[1];
                if (accent) document.documentElement.dataset.accent = accent;
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
