name: Release

on:
    push:
        tags:
            - "v*"

env:
    REGISTRY: ghcr.io
    IMAGE_BASE: ghcr.io/${{ github.repository }}
    DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

jobs:
    prepare:
        name: Prepare Release
        runs-on: blacksmith-4vcpu-ubuntu-2404
        permissions:
            contents: write
        outputs:
            packages: ${{ steps.detect.outputs.packages }}
            has_releases: ${{ steps.detect.outputs.has_releases }}
            version: ${{ steps.get_version.outputs.version }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Extract Version
              id: get_version
              run: |
                  # Read version from root package.json
                  ROOT_VERSION=$(jq -er '.version' package.json)
                  echo "VERSION=$ROOT_VERSION" >> $GITHUB_ENV
                  echo "version=$ROOT_VERSION" >> $GITHUB_OUTPUT

            - name: Update Lockfile
              run: pnpm install --lockfile-only

            - name: Git Identity
              run: |
                  git config --global user.name 'github-actions[bot]'
                  git config --global user.email 'github-actions[bot]@users.noreply.github.com'

            - name: Commit and Sync
              run: |
                  # Commit changes only if there are any
                  if [ -n "$(git status --porcelain)" ]; then
                    git add .
                    git commit -m "chore: release v${{ env.VERSION }}"
                  else
                    echo "No changes to commit. Version might have been manually bumped."
                  fi

                  # Push to release branch
                  git push --force origin HEAD:refs/heads/release

                  # Sync to the repository default branch
                  git fetch origin release ${{ env.DEFAULT_BRANCH }}
                  git checkout -B ${{ env.DEFAULT_BRANCH }} origin/${{ env.DEFAULT_BRANCH }}
                  git merge origin/release
                  git push origin ${{ env.DEFAULT_BRANCH }}

            - name: Find All Packages with Dockerfiles
              id: detect
              run: |
                  PACKAGES="[]"

                  # Find every app/package directory that has a Dockerfile
                  for DOCKERFILE in $(find apps packages -maxdepth 2 -name "Dockerfile" | sort); do
                    DIR=$(dirname "$DOCKERFILE")

                    # Node apps are named by package.json and build from the repo root.
                    # Go apps (the sidecar) have no package.json, so use the directory
                    # name and build from their own directory.
                    if [ -f "$DIR/package.json" ]; then
                      NAME=$(jq -r '.name // empty' "$DIR/package.json")
                      CONTEXT="."
                    else
                      NAME=$(basename "$DIR")
                      CONTEXT="$DIR"
                    fi

                    if [ -n "$NAME" ]; then
                      # Remove scope if present (e.g. @stoat/stoat -> stoat)
                      APP=${NAME#@*/}
                      IMAGE=$(echo "${{ env.REGISTRY }}/${{ github.repository_owner }}/$APP" | tr '[:upper:]' '[:lower:]')

                      ITEM=$(jq -n \
                        --arg name "$NAME" \
                        --arg app "$APP" \
                        --arg image "$IMAGE" \
                        --arg dir "$DIR" \
                        --arg context "$CONTEXT" \
                        '{name: $name, app: $app, image: $image, dir: $dir, context: $context}')

                      PACKAGES=$(echo "$PACKAGES" | jq -c --argjson item "$ITEM" '. + [$item]')
                      echo "Found: $NAME (dir: $DIR, context: $CONTEXT)"
                    fi
                  done

                  # Use heredoc to safely output JSON
                  echo "packages<<EOF" >> $GITHUB_OUTPUT
                  echo "$PACKAGES" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

                  if [ "$PACKAGES" != "[]" ]; then
                    echo "has_releases=true" >> $GITHUB_OUTPUT
                  else
                    echo "has_releases=false" >> $GITHUB_OUTPUT
                  fi

                  echo "Packages for Docker build:"
                  echo "$PACKAGES" | jq .

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ github.ref_name }}
                  generate_release_notes: true

    # Each architecture builds on a native runner (QEMU-emulated arm64 builds take
    # hours) and is pushed by digest. publish-docker joins the digests into one
    # multi-arch tag.
    build-docker:
        name: Build ${{ matrix.package.app }} (${{ matrix.platform.arch }})
        needs: prepare
        if: needs.prepare.outputs.has_releases == 'true'
        runs-on: ${{ matrix.platform.runner }}
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.prepare.outputs.packages) }}
                platform:
                    - { name: linux/amd64, arch: amd64, runner: blacksmith-8vcpu-ubuntu-2404 }
                    - { name: linux/arm64, arch: arm64, runner: blacksmith-8vcpu-ubuntu-2404-arm }
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  ref: release

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ matrix.package.image }}

            - name: Setup Blacksmith Builder
              uses: useblacksmith/setup-docker-builder@v1

            - name: Docker Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Docker Image Build
              id: build
              uses: useblacksmith/build-push-action@v2
              with:
                  context: ${{ matrix.package.context }}
                  file: ${{ matrix.package.dir }}/Dockerfile
                  platforms: ${{ matrix.platform.name }}
                  labels: ${{ steps.meta.outputs.labels }}
                  tags: ${{ matrix.package.image }}
                  outputs: type=image,push-by-digest=true,name-canonical=true,push=true

            - name: Export Digest
              run: |
                  mkdir -p "${{ runner.temp }}/digests"
                  DIGEST="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

            - name: Upload Digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.package.app }}-${{ matrix.platform.arch }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    publish-docker:
        name: Publish ${{ matrix.package.app }}
        needs: [prepare, build-docker]
        runs-on: blacksmith-4vcpu-ubuntu-2404
        permissions:
            contents: read
            packages: write
        strategy:
            fail-fast: false
            matrix:
                package: ${{ fromJson(needs.prepare.outputs.packages) }}
        steps:
            - name: Download Digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-${{ matrix.package.app }}-*
                  merge-multiple: true

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ matrix.package.image }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
                      type=semver,pattern={{major}},value=${{ needs.prepare.outputs.version }}
                      type=raw,value=latest

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Docker Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Publish Multi-Arch Manifest
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ matrix.package.image }}@sha256:%s ' *)
