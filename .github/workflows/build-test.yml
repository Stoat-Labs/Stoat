name: Build Test

on:
    pull_request:
        branches:
            - main
            - release

jobs:
    build-test:
        name: Build and Type Check
        runs-on: blacksmith-4vcpu-ubuntu-2404
        outputs:
            lint-status: ${{ steps.lint.conclusion }}
            format-status: ${{ steps.format.conclusion }}
            typecheck-status: ${{ steps.typecheck.conclusion }}
            test-status: ${{ steps.test.conclusion }}
            go-test-status: ${{ steps.go-test.conclusion }}
            build-status: ${{ steps.build.conclusion }}
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Dependencies
              id: install
              run: pnpm install --frozen-lockfile

            - name: Run Lint
              id: lint
              if: always() && steps.install.conclusion == 'success'
              run: pnpm run lint

            - name: Check Formatting
              id: format
              if: always() && steps.install.conclusion == 'success'
              run: pnpm exec vp fmt --check

            - name: Run Type Check
              id: typecheck
              if: always() && steps.install.conclusion == 'success'
              run: pnpm run check-types

            - name: Run TypeScript Tests
              id: test
              if: always() && steps.install.conclusion == 'success'
              run: pnpm run test

            - name: Install Playwright Chromium
              id: playwright
              if: always() && steps.install.conclusion == 'success'
              run: pnpm exec playwright install --with-deps chromium

            - name: Run E2E Tests
              id: e2e
              if: always() && steps.playwright.conclusion == 'success'
              run: pnpm run test:e2e

            - name: Upload E2E Artifacts
              if: failure() && steps.e2e.conclusion == 'failure'
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-results
                  path: test-results/e2e

            - name: Setup Go
              id: setup-go
              if: always()
              uses: actions/setup-go@v5
              with:
                  go-version-file: apps/sidecar/go.mod
                  cache-dependency-path: apps/sidecar/go.sum

            - name: Run Go Tests
              id: go-test
              if: always() && steps.setup-go.conclusion == 'success'
              working-directory: apps/sidecar
              run: go test ./...

            - name: Build All Packages
              id: build
              if: always() && steps.install.conclusion == 'success'
              run: pnpm run build

    comment-pr:
        name: Comment on PR
        runs-on: ubuntu-latest
        needs: build-test
        if: always() && github.event_name == 'pull_request'
        permissions:
            pull-requests: write
        steps:
            - name: Post PR Comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const lintStatus = '${{ needs.build-test.outputs.lint-status }}';
                      const formatStatus = '${{ needs.build-test.outputs.format-status }}';
                      const buildStatus = '${{ needs.build-test.result }}';
                      const typecheckStatus = '${{ needs.build-test.outputs.typecheck-status }}';
                      const testStatus = '${{ needs.build-test.outputs.test-status }}';
                      const goTestStatus = '${{ needs.build-test.outputs.go-test-status }}';
                      const buildStepStatus = '${{ needs.build-test.outputs.build-status }}';

                      let statusEmoji = '✅';
                      let statusText = 'Build Passed';

                      if (buildStatus === 'failure') {
                        statusEmoji = '❌';
                        statusText = 'Build Failed';
                      } else if (buildStatus === 'cancelled') {
                        statusEmoji = '⚠️';
                        statusText = 'Build Cancelled';
                      }

                      // Build detailed status
                      let detailedStatus = '';

                      if (lintStatus === 'success') {
                        detailedStatus += '✅ **Lint**: Passed\n';
                      } else if (lintStatus === 'failure') {
                        detailedStatus += '❌ **Lint**: Failed\n';
                      }

                      if (formatStatus === 'success') {
                        detailedStatus += '✅ **Formatting**: Passed\n';
                      } else if (formatStatus === 'failure') {
                        detailedStatus += '❌ **Formatting**: Failed\n';
                      }

                      // Type Check Status
                      if (typecheckStatus === 'success') {
                        detailedStatus += '✅ **Type Check**: Passed\n';
                      } else if (typecheckStatus === 'failure') {
                        detailedStatus += '❌ **Type Check**: Failed\n';
                      }

                      if (testStatus === 'success') {
                        detailedStatus += '✅ **TypeScript Tests**: Passed\n';
                      } else if (testStatus === 'failure') {
                        detailedStatus += '❌ **TypeScript Tests**: Failed\n';
                      }

                      if (goTestStatus === 'success') {
                        detailedStatus += '✅ **Go Tests**: Passed\n';
                      } else if (goTestStatus === 'failure') {
                        detailedStatus += '❌ **Go Tests**: Failed\n';
                      }

                      // Build Status
                      if (buildStepStatus === 'success') {
                        detailedStatus += '✅ **Build**: Passed\n';
                      } else if (buildStepStatus === 'failure') {
                        detailedStatus += '❌ **Build**: Failed\n';
                      }

                      const comment = `## ${statusEmoji} ${statusText}\n\n${detailedStatus}\n___\n*Build test completed for commit ${context.sha.substring(0, 7)}*`;

                      // Find existing comment
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const botComment = comments.find(comment => 
                        comment.user.type === 'Bot' && 
                        comment.body.includes('Build test completed')
                      );

                      if (botComment) {
                        // Update existing comment
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body: comment
                        });
                      } else {
                        // Create new comment
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: comment
                        });
                      }
