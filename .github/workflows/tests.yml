name: Tests

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

concurrency:
    group: tests-${{ github.ref }}
    cancel-in-progress: true

# Placeholders so varlock validation passes in `svelte-kit sync` (postinstall); tests set their own values.
env:
    APP_SECRET: ci-secret-that-is-at-least-32-characters-long
    APP_URL: http://localhost:3000
    DATABASE_URL: postgresql://build:build@localhost:5432/build

jobs:
    unit:
        name: Unit Tests
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Unit Tests
              run: pnpm run test

    e2e:
        name: E2E Tests
        runs-on: blacksmith-4vcpu-ubuntu-2404
        steps:
            - name: Checkout Repo
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Run E2E Tests
              run: pnpm run test:e2e

            - name: Upload E2E Artifacts
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: e2e-results
                  path: test-results/e2e
