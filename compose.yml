name: stoat

services:
    stoat:
        image: ghcr.io/stoat-labs/stoat:latest
        pull_policy: always
        x-ports:
            - "${APP_URL:-stoat.example.com}:3001/https"
        env_file: .env
        environment:
            APP_URL: https://${APP_URL:-stoat.example.com}
            DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-password}@stoat-db.internal:5432/stoat}
            REDIS_URL: ${REDIS_URL:-redis://stoat-cache.internal:6379}
        x-pre_deploy:
            command:
                [
                    "node",
                    "node_modules/drizzle-kit/bin.cjs",
                    "migrate",
                    "--config",
                    "drizzle.config.ts",
                ]
        depends_on:
            stoat-db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s
        restart: unless-stopped

    stoat-db:
        image: postgres:18
        environment:
            POSTGRES_DB: stoat
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
        volumes:
            - stoat_db_data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    # Optional but recommended. Without a Redis-compatible cache, Stoat caches in memory.
    stoat-cache:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
        volumes:
            - stoat_cache_data:/data
        restart: unless-stopped

    sidecar:
        image: ghcr.io/irazvan2745/sidecar:latest
        env_file: .env
        environment:
            # Required by every endpoint except /healthz; the sidecar won't start without it.
            SIDECAR_TOKEN: ${SIDECAR_TOKEN:?set SIDECAR_TOKEN to a random secret, e.g. openssl rand -hex 32}
        volumes:
            - /run/uncloud:/run/uncloud:ro
        # Root + privileged + host PID: the sidecar talks to the Uncloud socket and
        # runs host commands via nsenter into PID 1. Uncloud ignores group_add.
        user: root
        privileged: true
        pid: host
        deploy:
            mode: global
        restart: unless-stopped

volumes:
    stoat_db_data:
    stoat_cache_data:
