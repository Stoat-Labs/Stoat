####################################################################################################
# The sidecar ProvisionCluster deploys to clusters Clowder creates over SSH.
#
# Every machine serves the API over HTTPS on port 51443 with a self-signed certificate that Clowder
# generates and pins, so no domain or certificate authority sits between Clowder and the cluster.
# Port 80 stays plain HTTP on the cluster network for the monitoring stack.
####################################################################################################
name: clowder

services:
    sidecar:
        image: ghcr.io/clowder-run/sidecar:latest
        # The image's CMD plus the HTTPS listener.
        command:
            [
                "--listen",
                "0.0.0.0:80",
                "--tls-listen",
                "0.0.0.0:51443",
                "--geoip-dir",
                "/host/var/lib/clowder/geoip",
            ]
        environment:
            SIDECAR_TOKEN: ${SIDECAR_TOKEN:?set by ProvisionCluster}
            SIDECAR_TLS_CERT: ${SIDECAR_TLS_CERT:?set by ProvisionCluster}
            SIDECAR_TLS_KEY: ${SIDECAR_TLS_KEY:?set by ProvisionCluster}
        volumes:
            - /run/uncloud:/run/uncloud:ro
            # The sidecar installs the GeoIP database Alloy reads from here (--geoip-dir).
            - /var/lib/clowder/geoip:/host/var/lib/clowder/geoip
        # Root + privileged + host PID: the sidecar talks to the Uncloud socket and
        # runs host commands via nsenter into PID 1. Uncloud ignores group_add.
        user: root
        privileged: true
        pid: host
        deploy:
            mode: global
        restart: unless-stopped
        x-ports:
            - 51443:51443@host
