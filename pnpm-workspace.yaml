packages:
    - apps/*
    - packages/*
allowBuilds:
    cpu-features: false
    esbuild: true
    protobufjs: false
    ssh2: false
catalog:
    typescript: ^6.0.3
    varlock: 1.18.0
    "@orpc/server": 2.0.0-beta.35
    "@orpc/client": 2.0.0-beta.35
    "@orpc/openapi": 2.0.0-beta.35
    "@orpc/valibot": 2.0.0-beta.35
    "@orpc/tanstack-query": 2.0.0-beta.35
    valibot: ^1.5.0
    yaml: ^2.9.0
    better-auth: 1.7.3
    "@better-auth/api-key": 1.7.3
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0
    ofetch: ^1.5.1
    drizzle-orm: 1.0.0-rc.5-5935859
    drizzle-kit: 1.0.0-rc.5-5935859
minimumReleaseAgeExclude:
    - "@effect/sql-pg@4.0.0-rc.116"
    - effect@4.0.0-rc.116
    - skullet@0.0.3
overrides:
    vite@*: "catalog:"
    "@esbuild-kit/core-utils>esbuild": ^0.28.2
    "@sveltejs/kit>cookie": ^0.7.2
    drizzle-kit: "catalog:"
patchedDependencies:
    effect-mq@0.7.0: patches/effect-mq@0.7.0.patch
    nuqs-svelte@1.2.2: patches/nuqs-svelte@1.2.2.patch
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: "*"
