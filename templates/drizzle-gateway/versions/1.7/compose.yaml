services:
    drizzle-gateway:
        image: ghcr.io/drizzle-team/gateway:1.7.0
        restart: unless-stopped
        x-ports:
            - ${DRIZZLE_GATEWAY_HOST}:4983/https
        environment:
            PORT: "4983"
            STORE_PATH: /app
            MASTERPASS: ${MASTERPASS}
        volumes:
            - drizzle_gateway:/app

volumes:
    drizzle_gateway:
