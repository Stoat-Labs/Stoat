services:
    db:
        image: mariadb:10.11
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
            MYSQL_LOG_CONSOLE: "true"
            MARIADB_AUTO_UPGRADE: "1"
        volumes:
            - seafile_db:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD",
                    "/usr/local/bin/healthcheck.sh",
                    "--connect",
                    "--mariadbupgrade",
                    "--innodb_initialized",
                ]
            interval: 20s
            start_period: 30s
            timeout: 5s
            retries: 10

    cache:
        image: redis:8-alpine
        restart: unless-stopped
        command:
            [
                "/bin/sh",
                "-c",
                'exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no',
            ]
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}

    server:
        image: seafileltd/seafile-pro-mc:13.0-latest
        restart: unless-stopped
        volumes:
            - seafile_data:/shared
        environment:
            INIT_SEAFILE_MYSQL_ROOT_PASSWORD: ${INIT_SEAFILE_MYSQL_ROOT_PASSWORD}
            SEAFILE_MYSQL_DB_HOST: db
            SEAFILE_MYSQL_DB_PORT: "3306"
            SEAFILE_MYSQL_DB_USER: seafile
            SEAFILE_MYSQL_DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD}
            SEAFILE_MYSQL_DB_CCNET_DB_NAME: ccnet_db
            SEAFILE_MYSQL_DB_SEAFILE_DB_NAME: seafile_db
            SEAFILE_MYSQL_DB_SEAHUB_DB_NAME: seahub_db
            TIME_ZONE: ${TIME_ZONE}
            INIT_SEAFILE_ADMIN_EMAIL: ${INIT_SEAFILE_ADMIN_EMAIL}
            INIT_SEAFILE_ADMIN_PASSWORD: ${INIT_SEAFILE_ADMIN_PASSWORD}
            SEAFILE_SERVER_HOSTNAME: ${SEAFILE_SERVER_HOSTNAME}
            SEAFILE_SERVER_PROTOCOL: ${SEAFILE_SERVER_PROTOCOL}
            SITE_ROOT: /
            NON_ROOT: "false"
            JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
            SEAFILE_LOG_TO_STDOUT: "true"
            ENABLE_GO_FILESERVER: "true"
            ENABLE_SEADOC: "true"
            SEADOC_SERVER_URL: ${SEAFILE_SERVER_PROTOCOL}://${SEAFILE_SERVER_HOSTNAME}/sdoc-server
            CACHE_PROVIDER: redis
            REDIS_HOST: cache
            REDIS_PORT: "6379"
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            ENABLE_NOTIFICATION_SERVER: "false"
            ENABLE_SEAFILE_AI: "false"
        x-caddy: |
            ${SEAFILE_SERVER_HOSTNAME} {
                handle_path /socket.io/* {
                    rewrite * /socket.io{uri}
                    reverse_proxy {{upstreams "seadoc" 80}}
                }
                handle_path /sdoc-server/* {
                    rewrite * {uri}
                    reverse_proxy {{upstreams "seadoc" 80}}
                }
                reverse_proxy {{upstreams 80}}
            }
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
        depends_on:
            db:
                condition: service_healthy
            cache:
                condition: service_started

    seadoc:
        image: seafileltd/sdoc-server:2.0-latest
        restart: unless-stopped
        volumes:
            - seadoc_data:/shared
        environment:
            DB_HOST: db
            DB_PORT: "3306"
            DB_USER: seafile
            DB_PASSWORD: ${SEAFILE_MYSQL_DB_PASSWORD}
            DB_NAME: seahub_db
            TIME_ZONE: ${TIME_ZONE}
            JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
            NON_ROOT: "false"
            SEAHUB_SERVICE_URL: http://server
        depends_on:
            db:
                condition: service_healthy

volumes:
    seafile_db:
    seafile_data:
    seadoc_data:
