services:
    forgejo:
        image: codeberg.org/forgejo/forgejo:16.0.2
        restart: unless-stopped
        x-ports:
            - ${FORGEJO_HOST}:3000/https
            - 2222:22/tcp@host
        environment:
            USER_UID: ${USER_UID}
            USER_GID: ${USER_GID}
            TZ: ${TZ}
            FORGEJO__server__DOMAIN: ${FORGEJO_HOST}
            FORGEJO__server__ROOT_URL: https://${FORGEJO_HOST}/
            FORGEJO__server__SSH_DOMAIN: ${FORGEJO_HOST}
            FORGEJO__server__SSH_PORT: "2222"
            FORGEJO__database__DB_TYPE: postgres
            FORGEJO__database__HOST: ${DB_HOST}:5432
            FORGEJO__database__NAME: ${DB_NAME}
            FORGEJO__database__USER: ${DB_USER}
            FORGEJO__database__PASSWD: ${DB_PASSWORD}
        volumes:
            - forgejo_data:/data
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

volumes:
    forgejo_data:
