services:
    trilium:
        image: triliumnext/trilium:v0.106.1
        restart: unless-stopped
        environment:
            - TRILIUM_DATA_DIR=/home/node/trilium-data
            - TZ=${TZ}
        x-ports:
            - ${TRILIUM_HOST}:8080/https
        volumes:
            - trilium-data:/home/node/trilium-data
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health-check"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

volumes:
    trilium-data:
