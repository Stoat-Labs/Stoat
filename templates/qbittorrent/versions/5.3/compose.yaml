services:
    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:5.3.0
        environment:
            - PUID=${MEDIA_UID}
            - PGID=${MEDIA_GID}
            - TZ=${TZ}
            - WEBUI_PORT=8080
            - TORRENTING_PORT=${TORRENTING_PORT}
        volumes:
            - qbittorrent_data:/config
            - ${DOWNLOADS_PATH}:/downloads
        x-ports:
            - ${QBITTORRENT_HOST}:8080/https
            - ${TORRENTING_PORT}:${TORRENTING_PORT}/tcp@host
            - ${TORRENTING_PORT}:${TORRENTING_PORT}/udp@host
        healthcheck:
            test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        stop_grace_period: "10s"
        restart: unless-stopped

volumes:
    qbittorrent_data:
