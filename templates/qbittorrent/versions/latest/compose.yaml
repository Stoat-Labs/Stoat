services:
    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        environment:
            - PUID=${MEDIA_UID}
            - PGID=${MEDIA_GID}
            - TZ=${TZ}
            - WEBUI_PORT=8080
            - TORRENTING_PORT=6881
        volumes:
            - qbittorrent_data:/config
            - ${DOWNLOADS_PATH}:/downloads
        x-ports:
            - ${QBITTORRENT_HOST}:8080:8080/https
            - 6881:6881
            - 6881:6881/udp
        healthcheck:
            test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
        stop_grace_period: "10s"
        restart: unless-stopped

volumes:
    qbittorrent_data:
