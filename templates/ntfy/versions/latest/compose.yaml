services:
    ntfy:
        image: binwiederhier/ntfy
        command:
            - serve
        environment:
            TZ: ${TZ}
            NTFY_BASE_URL: https://${NTFY_HOST}
            NTFY_BEHIND_PROXY: "true"
        x-ports:
            - ${NTFY_HOST}:80/https
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1",
                ]
            interval: 60s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped
        init: true
