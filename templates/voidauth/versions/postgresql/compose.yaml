services:
    voidauth:
        image: voidauth/voidauth:latest
        restart: unless-stopped
        x-ports:
            - ${VOIDAUTH_HOST}:3000/https
        #  - "3890:3890" # only needed if LDAP Server is enabled
        environment:
            # Public URL: OIDC issuer, redirects, and emailed links all use it.
            APP_URL: https://${VOIDAUTH_HOST}
            STORAGE_KEY: ${STORAGE_KEY}
            DB_HOST: ${DB_HOST}
            DB_PASSWORD: ${DB_PASSWORD}
        volumes:
            - voidauth_config:/app/config
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://localhost:3000/healthcheck').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 30s

volumes:
    voidauth_config:
