services:
    dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
        restart: unless-stopped
        command:
            [
                "dragonfly",
                "--logtostderr",
                "--requirepass=${DRAGONFLY_PASSWORD}",
                "--snapshot_cron=*/5 * * * *",
            ]
        ulimits:
            memlock: -1
        environment:
            DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
        volumes:
            - dragonfly_data:/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'redis-cli -a "$$DRAGONFLY_PASSWORD" --no-auth-warning ping | grep -q PONG',
                ]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    dragonfly_data:
