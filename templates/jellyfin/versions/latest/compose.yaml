services:
    jellyfin:
        # LinuxServer image: PUID/PGID let Jellyfin read host media with the right ownership.
        image: lscr.io/linuxserver/jellyfin:latest
        restart: unless-stopped
        x-ports:
            - ${JELLYFIN_HOST}:8096/https
        environment:
            PUID: ${MEDIA_UID}
            PGID: ${MEDIA_GID}
            TZ: ${TZ}
            JELLYFIN_PublishedServerUrl: https://${JELLYFIN_HOST}
        volumes:
            - jellyfin_config:/config
            - jellyfin_media:/media
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:8096/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 60s

volumes:
    jellyfin_config:
    jellyfin_media:
