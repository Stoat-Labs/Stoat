services:
    redis:
        image: redis:8.10
        restart: unless-stopped
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
        environment:
            REDIS_PASSWORD: ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
                ]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    redis_data:
